name: Segurança

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # toda segunda-feira
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Segredos no código
        run: node scripts/check-secrets.mjs
      - name: Dependências usadas pelo site (produção)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Dependências de build (informativo)
        run: npm audit --audit-level=critical || true

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Migrações e regras de segurança (RLS, mass assignment, acesso anônimo)
        run: scripts/test-db.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
